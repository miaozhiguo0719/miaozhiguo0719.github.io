<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#e8e7e1"><title>WAIST 腰平相机 · 交互原型</title><link rel="stylesheet" href="./waist.css?v=20261026-1"><script src="./waist.js?v=20261026-1" defer></script></head>
<body class="waist-demo"><main><a class="back" href="./design-duo.html">← 返回设计项目</a><header><h1>WAIST / 腰平</h1><p>iPhone Duo · 90° 折叠相机概念<br>下方屏幕完成构图、调整与拍摄。</p></header>
<section class="waist-app" aria-label="腰平相机交互原型"><div class="waist-finder"><img id="waist-scene" src="./assets/photos/08-old-building.webp" alt="演示取景：树木环绕的红色建筑，摄影：苗志国"><div class="waist-grid" aria-hidden="true"></div><span class="waist-focus" aria-hidden="true"></span><span class="waist-preview-label">DEMO VIEWFINDER</span><div class="waist-preview-meta"><span>AE / AUTO</span><span id="waist-current-look">CLASSIC 400</span></div></div><div class="waist-rail"><div class="waist-brand"><strong>WAIST<span aria-hidden="true"> / 腰平</span></strong><span>90° MODE</span></div><div class="waist-film"><span>胶片模拟</span><div class="waist-film-options" role="group" aria-label="选择胶片模拟"><button type="button" data-look="classic" aria-pressed="true">CLASSIC 400</button><button type="button" data-look="fade" aria-pressed="false">FADE 200</button><button type="button" data-look="mono" aria-pressed="false">MONO 100</button></div></div><div class="waist-exposure"><label for="waist-ev">曝光补偿 <output for="waist-ev" id="waist-ev-value">0.0 EV</output></label><input id="waist-ev" type="range" min="-2" max="2" value="0" step="0.1" aria-label="曝光补偿 EV"><div class="waist-ev-scale" aria-hidden="true"><span>−2</span><span>−1</span><span>0</span><span>+1</span><span>+2</span></div></div><div class="waist-capture"><button type="button" class="waist-thumb" aria-label="回看最近一张演示照片" disabled><img alt="最近拍摄的演示照片"></button><button type="button" class="waist-shutter" aria-label="拍摄演示照片"></button><span class="waist-count">CAPTURED<br><b id="waist-count">00</b></span></div><p class="waist-status" role="status" aria-live="polite">选择胶片，调整 EV，然后按下快门。</p></div></section>
<div class="waist-notes"><p>交互原型使用固定照片演示色彩、曝光与拍后回看，不调用真实相机。胶片名称为原创模拟预设；数值不代表真实感光度。创意：苗志国 / AI 协作设计。</p><a href="./design-duo.html">查看完整设计思路 ↗</a></div>
<dialog class="waist-review" aria-label="演示照片回看"><div><p id="waist-review-meta"></p><button type="button" data-close-review>返回取景 ×</button></div><img id="waist-review-image" alt="当前胶片与曝光设置下的演示照片"><a id="waist-download" download="waist-demo.png">保存演示照片 ↓</a></dialog>
</main></body></html>
